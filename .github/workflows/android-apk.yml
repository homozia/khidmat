# Builds the signed field-test APK (Khidmat TEST) on demand: Actions → "Field-test APK" → Run workflow.
# Signing material lives only in repository secrets (Settings → Secrets and variables → Actions):
#   KHIDMAT_KEYSTORE_BASE64   base64 of the field-test keystore
#   KHIDMAT_KEYSTORE_PASSWORD, KHIDMAT_KEY_ALIAS, KHIDMAT_KEY_PASSWORD
# Optional repository variables:
#   KHIDMAT_TEST_API_URL      pre-fills the app's server address (testers can change it in the app)
#   KHIDMAT_CERT_SHA256       expected signing-certificate SHA-256; the build fails if the key differs, because a
#                             different key would stop an installed test build from updating in place
name: Field-test APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode. Must be higher than the last APK you handed out (M4 = 4, M4.1 = 5).
        required: true
        default: '5'
permissions: { contents: read }

env:
  APK_NAME: khidmat-m4.1-field-test.apk
  EXPECTED_PACKAGE: pk.khidmat.customer.fieldtest
  EXPECTED_VERSION: 0.4.1

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: fieldtest
      EXPO_PUBLIC_APP_VARIANT: fieldtest
      KHIDMAT_VERSION_CODE: ${{ inputs.version_code }}
      EXPO_PUBLIC_API_URL: ${{ vars.KHIDMAT_TEST_API_URL }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Use the runner's preinstalled Android SDK and accept its licences
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
      - run: npm ci

      - name: Check the signing secrets are present
        env:
          KS: ${{ secrets.KHIDMAT_KEYSTORE_BASE64 }}
          P1: ${{ secrets.KHIDMAT_KEYSTORE_PASSWORD }}
          P2: ${{ secrets.KHIDMAT_KEY_ALIAS }}
          P3: ${{ secrets.KHIDMAT_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing KHIDMAT_KEYSTORE_BASE64"
          [ -n "$P1" ] || missing="$missing KHIDMAT_KEYSTORE_PASSWORD"
          [ -n "$P2" ] || missing="$missing KHIDMAT_KEY_ALIAS"
          [ -n "$P3" ] || missing="$missing KHIDMAT_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing (see docs/operations/android-builds.md)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KHIDMAT_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the release APK (JavaScript bundle embedded, no Metro needed)
        working-directory: apps/mobile/android
        env:
          KHIDMAT_KEYSTORE_PASSWORD: ${{ secrets.KHIDMAT_KEYSTORE_PASSWORD }}
          KHIDMAT_KEY_ALIAS: ${{ secrets.KHIDMAT_KEY_ALIAS }}
          KHIDMAT_KEY_PASSWORD: ${{ secrets.KHIDMAT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature, package, version, bundle and checksum
        env:
          EXPECTED_CERT: ${{ vars.KHIDMAT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/$APK_NAME"
          cd out
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || { echo "::error::APK is not v2-signed"; exit 1; }
          if grep -q "CN=Android Debug" apksigner.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          CERT=$(grep -m1 "certificate SHA-256 digest" apksigner.txt | awk '{print $NF}')
          if [ -n "${EXPECTED_CERT:-}" ]; then
            want=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$CERT" = "$want" ] || { echo "::error::Signed with a different key ($CERT); installed test builds could not update in place"; exit 1; }
          fi
          "$BT/aapt2" dump badging "$APK_NAME" > badging-full.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" badging-full.txt | tee badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" badging.txt || { echo "::error::Wrong package id"; exit 1; }
          grep -q "versionCode='$KHIDMAT_VERSION_CODE'" badging.txt || { echo "::error::Wrong versionCode"; exit 1; }
          grep -q "versionName='$EXPECTED_VERSION'" badging.txt || { echo "::error::Wrong versionName"; exit 1; }
          grep -q "sdkVersion:'24'" badging.txt || { echo "::error::Minimum Android is not 7.0 (API 24)"; exit 1; }
          unzip -l "$APK_NAME" | grep -E "assets/index.android.bundle" | tee bundle.txt
          test -s bundle.txt || { echo "::error::JavaScript bundle is missing from the APK"; exit 1; }
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          {
            echo "## $APK_NAME"
            echo '```'; cat badging.txt; echo "certificate SHA-256: $CERT"; cat "$APK_NAME.sha256"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f badging-full.txt "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: khidmat-m4.1-field-test
          path: out/
          retention-days: 30
